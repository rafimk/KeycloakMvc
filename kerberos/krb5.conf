# Kerberos client settings for the lab.test domain, used by Keycloak and the test client.
[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1

[realms]
    LAB.TEST = {
        kdc = dc1.lab.test
        admin_server = dc1.lab.test
    }

[domain_realm]
    .lab.test = LAB.TEST
    lab.test = LAB.TEST
