services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-password
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/mvc-sample-realm.json:/opt/keycloak/data/import/mvc-sample-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  mvc:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__MetadataAddress: http://keycloak:8080/realms/mvc-sample/.well-known/openid-configuration
      # Replaces the first sample domain with the local Samba lab domain. Point these at your
      # real Active Directory instead (and trust its CA) outside this sample.
      ActiveDirectory__Domains__0__Name: Lab
      ActiveDirectory__Domains__0__Domain: lab.test
      ActiveDirectory__Domains__0__NetBiosName: LAB
      ActiveDirectory__Domains__0__Server: dc1.lab.test
      ActiveDirectory__Domains__0__RoleMappings__0__Group: CN=App Admins,CN=Users,DC=lab,DC=test
      ActiveDirectory__Domains__0__RoleMappings__0__Role: Admin
      # libldap trusts the lab CA for LDAPS. A real deployment adds its CA to the system store.
      LDAPTLS_CACERT: /etc/lab-ca/lab-ca.pem
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - mvc-keys:/home/app/.aspnet/DataProtection-Keys
      - samba-ca:/etc/lab-ca:ro
    depends_on:
      keycloak:
        condition: service_healthy
      samba:
        condition: service_healthy
  # Local Active Directory (Samba 4 AD DC) for testing username/password sign-in. Development only.
  samba:
    build: ./samba
    hostname: dc1
    domainname: lab.test
    # Samba stores sysvol NT ACLs in security.* extended attributes, which needs this capability.
    cap_add:
      - SYS_ADMIN
    environment:
      SAMBA_ADMIN_PASSWORD: Admin!Lab2026
    volumes:
      - samba-ca:/tls-export
    networks:
      default:
        aliases:
          - dc1.lab.test
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/var/lib/samba/private/tls/ca.pem ldapsearch -H ldaps://dc1.lab.test -x -b '' -s base defaultNamingContext >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
volumes:
  keycloak-data:
  mvc-keys:
  samba-ca:
