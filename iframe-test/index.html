<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MVC Iframe Test</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2328; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #d0d7de; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        h1 { font-size: 16px; margin: 0 12px 0 0; }
        input { flex: 1; min-width: 220px; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
        button, a.button { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; font: inherit; color: inherit; text-decoration: none; cursor: pointer; }
        main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; min-height: 0; }
        iframe { flex: 1; width: 100%; border: 2px solid #0969da; border-radius: 6px; background: #fff; }
        #log { margin: 0; max-height: 120px; overflow: auto; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; font: 12px/1.5 ui-monospace, monospace; }
    </style>
</head>
<body>
<header>
    <h1>MVC app in an iframe</h1>
    <input id="url" value="http://localhost:5000/">
    <button id="load">Load</button>
    <button id="reload">Reload</button>
    <a class="button" id="newTab" href="http://localhost:5000/" target="_blank" rel="noopener">Open in new tab</a>
</header>
<main>
    <iframe id="frame" title="MVC application"></iframe>
    <pre id="log"></pre>
</main>
<script>
    const frame = document.getElementById("frame");
    const url = document.getElementById("url");
    const log = document.getElementById("log");

    function write(message) {
        log.textContent += `[${new Date().toLocaleTimeString()}] ${message}\n`;
        log.scrollTop = log.scrollHeight;
    }

    function load() {
        write(`Loading ${url.value}`);
        document.getElementById("newTab").href = url.value;
        frame.src = url.value;
    }

    // The load event also fires when the browser blocks the framed page, so
    // check DevTools > Console for X-Frame-Options / frame-ancestors errors.
    frame.addEventListener("load", () => write("iframe load event fired (blocked pages fire this too; check the DevTools console)"));
    document.getElementById("load").addEventListener("click", load);
    document.getElementById("reload").addEventListener("click", load);
    url.addEventListener("keydown", e => { if (e.key === "Enter") load(); });

    write(`Host page origin: ${location.origin}`);
    load();
</script>
</body>
</html>
